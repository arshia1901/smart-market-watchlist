# /api/quotes is byte-identical for every user (design section 10.3). This two-second
# micro-cache is that document's "edge cache", in miniature and observable: the
# X-Cache-Status header lets you watch one origin request serve many clients.
#
# Two seconds, deliberately. Longer and the ageing in the resilience demo would look
# quantised rather than continuous.
proxy_cache_path /var/cache/nginx/quotes levels=1:2 keys_zone=quotes:8m
                 max_size=32m inactive=60s use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Without `resolver` plus a variable upstream, nginx
    # resolves api:8000 once at startup and caches that IP forever - restarting the
    # api container would then 502 until nginx was restarted too.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /api/quotes {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_cache quotes;
        proxy_cache_valid 200 2s;
        proxy_cache_lock on;
        # Serve the last good response rather than a 502 if the api blinks.
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location /api/ {
        set $upstream http://api:8000;
        proxy_pass $upstream$request_uri;
        proxy_set_header Host $host;
        proxy_read_timeout 10s;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or the judge sees yesterday's bundle.
    # No `$uri/` here: an SPA route must never resolve to a directory. It did once -
    # an asset folder named `arch/` turned GET /arch into a 301 and a blank page.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
